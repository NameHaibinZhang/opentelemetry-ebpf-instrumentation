  # --- GPU device-level metrics --------------------------------------------
  # Node-level observations of the GPUs on the host, distinct from the
  # gpu.cuda.* family above (what instrumented applications do with CUDA).
  # Sourced from /proc/driver/nvidia/gpus, sysfs PCI attributes and
  # nvidia-smi. The `gpu.uuid` attribute value matches DCGM's `UUID` label
  # so series join across telemetry stacks.
  - name: obi.gpu.info
    instrument: updowncounter
    unit: ""
    stability: development
    requirement_level: recommended
    brief: >
      GPU inventory meta-metric, emitted with value 1 for each GPU present
      on the node, in the style of Prometheus `*_info` metrics. Carries the
      static identity of the GPU: PCI address, model and MIG capability.
    attributes:
      - ref: gpu.uuid
        requirement_level: required
      - ref: gpu.pci.bus.id
        requirement_level: recommended
      - ref: hw.model
        requirement_level: recommended
      - ref: gpu.mig.capable
        requirement_level:
          recommended: if MIG capability could be determined

  - name: obi.gpu.up
    instrument: gauge
    unit: ""
    stability: development
    requirement_level: recommended
    brief: >
      1 if the GPU is present and its device nodes are accessible, 0 if it
      has gone away since it was last observed. Presence cross-checks
      /proc/driver/nvidia/gpus against the /dev/nvidia* device nodes.
    attributes:
      - ref: gpu.uuid
        requirement_level: required

  - name: obi.gpu.numa.node
    instrument: gauge
    unit: ""
    stability: development
    requirement_level: recommended
    brief: >
      NUMA node the GPU is attached to, as the node index. Read from the
      sysfs numa_node attribute of the GPU's PCI device; when that is
      unknown, the GPU's CPU affinity from nvidia-smi topology output is
      matched against the CPU lists of the system NUMA nodes. Not reported
      when the node cannot be determined.
    attributes:
      - ref: gpu.uuid
        requirement_level: required

  - name: obi.gpu.pcie.generation
    instrument: gauge
    unit: ""
    stability: development
    requirement_level: recommended
    brief: >
      Currently negotiated PCIe link generation of the GPU's PCI device
      (1 = 2.5 GT/s up to 7 = 128 GT/s), from the sysfs current_link_speed
      attribute. Comparable to DCGM's DCGM_FI_DEV_PCIE_LINK_GEN.
    attributes:
      - ref: gpu.uuid
        requirement_level: required

  - name: obi.gpu.pcie.width
    instrument: gauge
    unit: ""
    stability: development
    requirement_level: recommended
    brief: >
      Number of lanes of the GPU's currently negotiated PCIe link, from the
      sysfs current_link_width attribute. Comparable to DCGM's
      DCGM_FI_DEV_PCIE_LINK_WIDTH.
    attributes:
      - ref: gpu.uuid
        requirement_level: required

  - name: obi.gpu.occupancy.conflict
    instrument: counter
    unit: ""
    stability: development
    requirement_level: recommended
    brief: >
      GPU sharing conflicts. Incremented by one on every collection cycle in
      which the pod still shares a GPU with at least one other distinct pod,
      so a sustained conflict shows up as a steady rate. The process set per
      GPU comes from the GPU's compute process list; pods are resolved from
      the process IDs.
    attributes:
      - ref: gpu.uuid
        requirement_level: required
      - ref: k8s.pod.name
        requirement_level: required
      - ref: k8s.job.name
        requirement_level:
          recommended: if the pod's owner chain includes a Job
      - ref: ml.rank
        requirement_level:
          recommended: if the process exports a RANK environment variable

  - name: obi.gpu.process.info
    instrument: updowncounter
    unit: ""
    stability: development
    requirement_level: recommended
    brief: >
      GPU compute process inventory, emitted with value 1 for each process
      currently holding the GPU, in the style of Prometheus `*_info`
      metrics. Carries the pod / job / rank identity resolved from the
      process.
    attributes:
      - ref: gpu.uuid
        requirement_level: required
      - ref: process.pid
        requirement_level: required
      - ref: process.executable.name
        requirement_level:
          recommended: if the executable name could be resolved
      - ref: k8s.pod.name
        requirement_level:
          recommended: if the process belongs to a Kubernetes pod
      - ref: k8s.job.name
        requirement_level:
          recommended: if the pod's owner chain includes a Job
      - ref: ml.rank
        requirement_level:
          recommended: if the process exports a RANK environment variable

  - name: obi.gpu.nvlink.up
    instrument: gauge
    unit: ""
    stability: development
    requirement_level: recommended
    brief: >
      NVLink port state: 1 when the link is active, 0 when it is inactive.
      Directly attached links carry the remote GPU's UUID; links routed
      through an NVSwitch carry the switch identifier instead.
    attributes:
      - ref: gpu.uuid
        requirement_level: required
      - ref: gpu.nvlink.link.id
        requirement_level: required
      - ref: gpu.peer.uuid
        requirement_level:
          conditionally_required: if the link is directly attached to a peer GPU
      - ref: gpu.nvlink.switch.id
        requirement_level:
          recommended: if the link is routed through an NVSwitch

  - name: obi.gpu.nvlink.rate
    instrument: gauge
    unit: ""
    stability: development
    requirement_level: recommended
    brief: >
      NVLink generation (rate class) of the GPU's NVLink ports, derived from
      the per-link data rate reported by nvidia-smi (e.g. 4 for NVLink Gen
      4). Reported as the generation number rather than GT/s; the
      per-generation bitrate table is not stable across architectures. Zero
      when the rate is unknown.
    attributes:
      - ref: gpu.uuid
        requirement_level: required
      - ref: gpu.nvlink.link.id
        requirement_level: required
      - ref: gpu.peer.uuid
        requirement_level:
          conditionally_required: if the link is directly attached to a peer GPU
      - ref: gpu.nvlink.switch.id
        requirement_level:
          recommended: if the link is routed through an NVSwitch

  - name: obi.gpu.nvlink.width
    instrument: gauge
    unit: ""
    stability: development
    requirement_level: recommended
    brief: >
      Number of lanes per NVLink port. Every NVLink generation the driver
      reports carries 4 lanes per port, so the value is constant; it is
      exposed for symmetry with the NVLink rate and up metrics.
    attributes:
      - ref: gpu.uuid
        requirement_level: required
      - ref: gpu.nvlink.link.id
        requirement_level: required
      - ref: gpu.peer.uuid
        requirement_level:
          conditionally_required: if the link is directly attached to a peer GPU
      - ref: gpu.nvlink.switch.id
        requirement_level:
          recommended: if the link is routed through an NVSwitch

  - name: obi.gpu.pcie.aer.errors
    instrument: counter
    unit: ""
    stability: development
    requirement_level: recommended
    brief: >
      PCIe Advanced Error Reporting (AER) errors observed on the GPU's PCI
      device, by severity, from the cumulative sysfs aer_dev_* counters.
    attributes:
      - ref: gpu.uuid
        requirement_level: required
      - ref: gpu.pcie.aer.severity
        requirement_level: required
      - ref: gpu.pci.bus.id
        requirement_level: recommended

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  text/plain;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    server {
        listen 80;
        server_name mock-imds;

        # readiness probe: the token endpoint below only accepts PUT
        location = /healthz {
            return 200 "ok";
        }

        # the session token is requested with PUT and the desired TTL,
        # and returned as plain text, as documented in
        # https://help.aliyun.com/zh/ecs/user-guide/view-instance-metadata/
        location = /latest/api/token {
            limit_except PUT {
                deny all;
            }
            if ($http_x_aliyun_ecs_metadata_token_ttl_seconds = "") {
                return 400;
            }
            return 200 "mock-imds-token";
        }

        # metadata values, only served when the session token is provided:
        # this emulates an ECS instance with HttpTokens=required
        location = /latest/meta-data/owner-account-id {
            if ($http_x_aliyun_ecs_metadata_token != "mock-imds-token") { return 403; }
            return 200 "1234567890123456";
        }

        location = /latest/meta-data/region-id {
            if ($http_x_aliyun_ecs_metadata_token != "mock-imds-token") { return 403; }
            return 200 "cn-shanghai";
        }

        location = /latest/meta-data/zone-id {
            if ($http_x_aliyun_ecs_metadata_token != "mock-imds-token") { return 403; }
            return 200 "cn-shanghai-e";
        }

        location = /latest/meta-data/image-id {
            if ($http_x_aliyun_ecs_metadata_token != "mock-imds-token") { return 403; }
            return 200 "aliyun_2_1903_x64_20G_alibase_20240124.vhd";
        }

        location = /latest/meta-data/instance/instance-type {
            if ($http_x_aliyun_ecs_metadata_token != "mock-imds-token") { return 403; }
            return 200 "ecs.g7.large";
        }

        location = /latest/meta-data/instance-id {
            if ($http_x_aliyun_ecs_metadata_token != "mock-imds-token") { return 403; }
            return 200 "i-2ze88pl0kljl42nbq6kd";
        }
    }
}

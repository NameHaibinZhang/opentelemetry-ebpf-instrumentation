# Built-in default configuration for the sidecar deployment.
#
# This file is embedded into the binary (see default_config.go) and used as a
# fallback when no configuration file is provided via --config or the
# OTEL_EBPF_CONFIG_PATH environment variable. It lets the sidecar run without a
# mounted ConfigMap in every namespace. Environment variables still override
# any value set here.
#
# Batching and eBPF map sizing below are tuned to keep the sidecar within a
# modest memory budget (e.g. 50Mi). Batching can be raised via environment
# variables (OTEL_EBPF_OTLP_TRACES_BATCH_MAX_SIZE,
# OTEL_EBPF_OTLP_TRACES_QUEUE_SIZE, ...) when higher trace throughput is
# required; ebpf.maps_config has no environment variable and must be changed
# in this file (or in a mounted config that replaces it).
log_level: warn

discovery:
  exclude_instrument:
    - k8s_namespace: obi-system
    - k8s_namespace: ack-onepilot
    - k8s_namespace: arms-prom
    - k8s_namespace: kube-system
    - k8s_namespace: kube-public
    - k8s_namespace: kube-node-lease
  instrument:
    # Both values are substituted from the environment at load time, so the
    # sidecar can narrow its instrumentation targets without a mounted
    # ConfigMap. Unset OBI_SIDECAR_TARGET_PORTS yields an empty port set, which
    # the matcher skips, keeping the default "instrument everything" behaviour.
    - exe_path: "${OBI_SIDECAR_TARGET_EXE:-*}"
      open_ports: "${OBI_SIDECAR_TARGET_PORTS:-}"

attributes:
  kubernetes:
    enable: false
  select:
    traces:
      include:
        - "gen_ai.*"
        - "gen_ai.tool.call.arguments"
        - "gen_ai.tool.call.result"

routes:
  unmatched: low-cardinality
  max_path_segment_cardinality: 500

ebpf:
  # Divides every resizable eBPF map by 8 (e.g. 30000 -> 3750 entries,
  # 10000 -> 1250). Preallocated maps are charged to the container's cgroup on
  # kernels >= 5.11, making them the largest fixed memory cost: the whole
  # tracer set shrinks from roughly 210 MiB at 0 to roughly 37 MiB here, which
  # is what lets the sidecar fit a 100Mi limit. The remaining ~10 MiB floor is
  # sock_dir and tracked_sock_cookies, which cannot be scaled. Raise this
  # value (max 3) for targets with very high in-flight request concurrency;
  # it has no environment variable, so edit this file or mount a ConfigMap.
  maps_config:
    global_scale_factor: -3
  context_propagation: all
  track_request_headers: true
  payload_extraction:
    http:
      genai:
        openai:
          enabled: true
        anthropic:
          enabled: true
        retrieval:
          enabled: true
        mcp:
          enabled: true
        qwen:
          enabled: true
        embedding:
          enabled: true
        gemini:
          enabled: true
        rerank:
          enabled: true
      # NOTE: jsonrpc is a sibling of genai (http.jsonrpc), not nested under it.
      jsonrpc:
        enabled: true
  buffer_sizes:
    http: 262144

otel_traces_export:
  batch_timeout: 5s
  batch_max_size: 128
  # queue_size must be >= 2 * batch_max_size, otherwise batches are rejected.
  queue_size: 512
  backoff_initial_interval: 5s
  backoff_max_interval: 15s
  backoff_max_elapsed_time: 2m
  instrumentations:
    # GenAI, MCP and JSON-RPC spans are HTTP-typed, so "http" (and "grpc" for
    # gRPC traffic) is all that is needed. Database and messaging are omitted
    # to avoid span churn unrelated to GenAI observability.
    - http
    - grpc

otel_metrics_export:
  instrumentations:
    - http
    - grpc
    - genai
